run_name: robotwin_raw_baku
run_root_dir: ${paths.output.robotwin_policy}
seed: 0
accelerator:
  mixed_precision: 'no'
  gradient_accumulation_steps: 1
task_name:
- adjust_bottle
- dump_bin_bigbin
- grab_roller
- lift_pot
- move_playingcard_away
- open_laptop
- place_burger_fries
- place_container_plate
- press_stapler
- shake_bottle_horizontally
camera_names:
- cam_high
- cam_left_wrist
- cam_right_wrist
chunk_size: 16
data_root: ${paths.data.robotwin}
datasets:
  action_data:
    dataset_py: robotwin_policy
    per_device_batch_size: 64
    num_workers: 0
    pin_memory: false
    dataset:
      path: ${data_root}
      task_name: ${task_name}
      camera_names: ${camera_names}
      chunk_size: ${chunk_size}
      action_ae_stats_path: null
      num_freqs: 256
      num_episodes: 50
      seed: ${seed}
framework:
  name: BakuPolicy
  action_space: raw
  action_ae_enabled: false
  image_key: image
  qpos_key: qpos
  action_key: action
  lang_key: task_emb
  is_pad_key: is_pad
  raw_loss_coef: 1.0
  baku_config:
    camera_names: ${camera_names}
    state_dim: 14
    action_dim: 14
    num_queries: ${chunk_size}
    hidden_dim: 512
    enc_layers: 4
    nheads: 8
    dim_feedforward: 2048
    dropout: 0.1
    head_layers: 2
    head_dropout: 0.0
    pretrained_backbone: false
trainer:
  learning_rate:
    base: 1e-4
  optimizer:
    weight_decay: 1e-4
    betas:
    - 0.9
    - 0.95
    eps: 1e-8
  is_resume: false
  resume_checkpoint: null
  max_train_steps: 600100
  log_every_steps: 100
  save_every_steps: 50000
