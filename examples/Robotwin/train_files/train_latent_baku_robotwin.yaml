run_name: robotwin_latent_baku
run_root_dir: ${paths.output.robotwin_policy}
seed: 0
accelerator:
  mixed_precision: 'no'
  gradient_accumulation_steps: 1
task_name:
- adjust_bottle
- dump_bin_bigbin
- grab_roller
- lift_pot
- move_playingcard_away
- open_laptop
- place_burger_fries
- place_container_plate
- press_stapler
- shake_bottle_horizontally
camera_names:
- cam_high
- cam_left_wrist
- cam_right_wrist
chunk_size: 32
latent_action_tokens: 8
latent_action_dim: 16
data_root: ${paths.data.robotwin}
action_ae:
  config_yaml: ${paths.action_ae.robotwin}/config.yaml
  ckpt_path: ${paths.action_ae.robotwin}/checkpoints/steps_${oc.env:ACTION_AE_STEP,160000}_pytorch_model.pt
  stats_path: ${paths.action_ae.robotwin}/dataset_statistics.json
datasets:
  action_data:
    dataset_py: robotwin_latent_policy
    per_device_batch_size: 64
    num_workers: 0
    pin_memory: false
    dataset:
      path: ${data_root}
      task_name: ${task_name}
      camera_names: ${camera_names}
      chunk_size: ${chunk_size}
      action_ae_stats_path: ${action_ae.stats_path}
      num_freqs: 48
      num_episodes: 50
      seed: ${seed}
      fft_type: dct
framework:
  name: BakuPolicy
  action_space: latent
  action_ae_enabled: true
  image_key: image
  qpos_key: qpos
  action_key: action
  lang_key: task_emb
  is_pad_key: is_pad
  action_ae_config: ${action_ae.config_yaml}
  action_ae_ckpt: ${action_ae.ckpt_path}
  decoded_loss_coef: 0.1
  latent_loss_coef: 1.0
  raw_loss_coef: 1.0
  baku_config:
    camera_names: ${camera_names}
    state_dim: 14
    action_dim: ${latent_action_dim}
    num_queries: ${latent_action_tokens}
    hidden_dim: 512
    enc_layers: 12
    nheads: 8
    dim_feedforward: 2048
    dropout: 0.1
    head_layers: 4
    head_dropout: 0.0
    pretrained_backbone: false
trainer:
  learning_rate:
    base: 1e-4
  optimizer:
    weight_decay: 1e-4
    betas:
    - 0.9
    - 0.95
    eps: 1e-8
  is_resume: false
  resume_checkpoint: null
  max_train_steps: 100100
  log_every_steps: 100
  save_every_steps: 10000
